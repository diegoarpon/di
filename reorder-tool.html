<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor — estudio.d</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #171f25;
  --surface: #1e2830;
  --surface-2: #252f38;
  --surface-3: #2c3a45;
  --border: #2e3d4a;
  --border-2: #3a4f5e;
  --text: #f6f6e4;
  --text-muted: #7a8f9e;
  --accent: #ff7518;
  --accent-dim: rgba(255,117,24,.15);
  --accent-border: rgba(255,117,24,.4);
  --green: #2ecc71;
  --red: #e74c3c;
  --radius: 8px;
  --card-w: 160px;
  --card-h: 220px;
  --panel-w: 420px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  gap: 12px;
}
h1 { font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--text-muted); text-transform: uppercase; white-space: nowrap; }
h1 span { color: var(--accent); }
.header-actions { display: flex; gap: 8px; align-items: center; }
.save-status { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.save-status.unsaved { color: var(--accent); }

/* ── Buttons ── */
.btn {
  padding: 7px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: background .15s, border-color .15s, opacity .15s;
  white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-2); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn-primary:hover:not(:disabled) { background: #e8660f; border-color: #e8660f; }
.btn-primary:disabled { background: var(--surface); border-color: var(--border); color: var(--text-muted); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-danger { border-color: var(--red); color: var(--red); }
.btn-danger:hover:not(:disabled) { background: rgba(231,76,60,.1); }

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 2px;
  padding: 12px 24px 0;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--bg);
}
.tab {
  padding: 8px 16px;
  border-radius: var(--radius) var(--radius) 0 0;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-muted);
  font-size: 13px;
  cursor: pointer;
  transition: color .15s, background .15s;
  position: relative;
  bottom: -1px;
  white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active { background: var(--surface); border-color: var(--border); border-bottom-color: var(--surface); color: var(--text); font-weight: 600; }
.tab .count { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 10px; background: var(--surface-2); font-size: 11px; color: var(--text-muted); }
.tab.active .count { background: var(--accent-dim); color: var(--accent); }
.tab.not-loaded { opacity: .5; }

/* ── Workspace ── */
.workspace {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* ── Grid area ── */
.grid-area {
  flex: 1;
  padding: 20px 24px;
  overflow-y: auto;
  min-width: 0;
}
.grid-hint { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }

.panel-wrap { display: none; }
.panel-wrap.active { display: block; }

.cards-grid { display: flex; flex-wrap: wrap; gap: 12px; }

/* ── Card ── */
.card {
  width: var(--card-w);
  height: var(--card-h);
  border-radius: var(--radius);
  border: 2px solid var(--border);
  background: var(--surface);
  position: relative;
  overflow: hidden;
  cursor: pointer;
  user-select: none;
  transition: transform .15s, box-shadow .15s, border-color .15s, opacity .15s;
  flex-shrink: 0;
}
.card:hover { border-color: var(--border-2); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card.dragging { opacity: .3; cursor: grabbing; }
.card.drag-over { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); transform: scale(1.02); }

.card-bg { position: absolute; inset: 0; background-size: cover; background-position: center; background-color: var(--surface-2); }
.card-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.1) 55%, transparent 100%); }

.card-order { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.65); border: 1px solid rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; z-index: 3; backdrop-filter: blur(4px); }

.card-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 12px; z-index: 2; }
.card-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { font-size: 11px; color: rgba(246,246,228,.5); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.card-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; opacity: .1; }

/* ── Empty state ── */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; min-height: 300px; color: var(--text-muted); text-align: center; }
.empty-state .icon { font-size: 36px; opacity: .3; }
.empty-state p { font-size: 14px; line-height: 1.6; }

/* ── Editor Panel ── */
.editor-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: var(--panel-w);
  height: 100vh;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--surface);
  transform: translateX(100%);
  transition: transform .25s ease;
  z-index: 100;
}
.editor-panel.open { transform: translateX(0); }

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  gap: 12px;
}
.panel-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel-close { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; transition: background .15s; }
.panel-close:hover { background: var(--surface-2); color: var(--text); }

.panel-body { flex: 1; overflow-y: auto; padding: 20px; }

/* ── Form fields ── */
.field-group { margin-bottom: 24px; }
.field-group-title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 7px; display: flex; align-items: center; gap: 5px; margin-top: 4px; }

.field-help {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1px solid var(--border-2);
  font-size: 9px;
  color: var(--text-muted);
  cursor: default;
  position: relative;
  flex-shrink: 0;
  line-height: 1;
}
.field-help:hover { border-color: var(--accent); color: var(--accent); }
.field-help .tooltip {
  display: none;
  position: absolute;
  bottom: calc(100% + 6px);
  left: 0;
  background: var(--surface-3);
  border: 1px solid var(--border-2);
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 11px;
  color: var(--text);
  white-space: normal;
  width: 200px;
  line-height: 1.5;
  z-index: 200;
  pointer-events: none;
}
.field-help:hover .tooltip { display: block; }

.field input[type="text"],
.field input[type="number"],
.field input[type="url"],
.field textarea,
.field select {
  width: 100%;
  padding: 7px 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  transition: border-color .15s;
  outline: none;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
.field select { cursor: pointer; }
.field select option { background: var(--surface-2); }

/* Toggle */
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
.toggle-row:last-child { border-bottom: none; }
.toggle-row label { font-size: 13px; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 5px; }
.toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; inset: 0; background: var(--surface-3); border: 1px solid var(--border); border-radius: 20px; cursor: pointer; transition: background .2s; }
.toggle-slider::before { content: ''; position: absolute; width: 14px; height: 14px; left: 2px; top: 2px; background: var(--text-muted); border-radius: 50%; transition: transform .2s, background .2s; }
.toggle input:checked + .toggle-slider { background: var(--accent-dim); border-color: var(--accent-border); }
.toggle input:checked + .toggle-slider::before { transform: translateX(16px); background: var(--accent); }

/* Image picker */
.img-picker { display: flex; flex-direction: column; gap: 6px; }
.img-preview { width: 100%; height: 80px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 12px; overflow: hidden; }
.img-preview img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
.img-picker-row { display: flex; gap: 6px; }
.img-picker-row select { flex: 1; }

/* Tags */
.tags-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; min-height: 28px; }
.tag-chip { display: flex; align-items: center; gap: 4px; padding: 3px 8px; background: var(--surface-3); border: 1px solid var(--border); border-radius: 20px; font-size: 12px; }
.tag-chip button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }
.tag-chip button:hover { color: var(--red); }
.tag-add-row { display: flex; gap: 6px; }
.tag-add-row input { flex: 1; }

/* ── Toast ── */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 18px; font-size: 13px; transition: transform .25s ease; z-index: 999; white-space: nowrap; pointer-events: none; }
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--green); color: var(--green); }
.toast.error { border-color: var(--red); color: var(--red); }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-2); }
</style>
</head>
<body>

<header>
  <h1>estudio.d — <span>editor</span></h1>
  <div class="header-actions">
    <span class="save-status" id="save-status"></span>
    <button class="btn" id="btn-open-dir">Abrir carpeta public_html/</button>
    <button class="btn btn-primary" id="btn-save" disabled>Guardar todo</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab not-loaded active" data-tab="brand-creation">Brand Creation <span class="count" id="count-bc">—</span></button>
  <button class="tab not-loaded" data-tab="brand-development">Brand Development <span class="count" id="count-bd">—</span></button>
  <button class="tab not-loaded" data-tab="product-design">Product Design <span class="count" id="count-pd">—</span></button>
</nav>

<div class="workspace">
  <div class="grid-area" id="grid-area">
    <div class="panel-wrap active" id="panel-brand-creation"></div>
    <div class="panel-wrap" id="panel-brand-development"></div>
    <div class="panel-wrap" id="panel-product-design"></div>
  </div>
  <aside class="editor-panel" id="editor-panel">
    <div class="panel-header">
      <div class="panel-title" id="panel-title">—</div>
      <button class="panel-close" id="panel-close">✕</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script src="reorder-tool.js?v=12"></script>
</body>
</html>
