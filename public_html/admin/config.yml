backend:
  name: github
  repo: diegoarpon/di
  branch: main
  base_url: https://di-livid-eight.vercel.app
  auth_endpoint: api/auth

media_folder: public_html/test/img/logos
public_folder: img/logos

collections:
  - name: brand_grid
    label: Brand Creation Grid
    files:
      - name: tiles
        label: Tiles
        file: public_html/test/brand-config.json
        fields:
          - name: tiles
            label: Tiles
            widget: list
            summary: "{{fields.alt}} — span {{fields.span}} / {{fields.size}}"
            types:
              - name: single
                label: Single Logo
                widget: object
                fields:
                  - { name: src,  label: Logo,  widget: image }
                  - { name: alt,  label: Nombre, widget: string }
                  - name: size
                    label: Tamaño
                    widget: select
                    options: [tile, tile-xl]
                  - name: span
                    label: Columnas
                    widget: select
                    options: [4, 8]

              - name: stack
                label: Stack (2-3 logos apilados)
                widget: object
                fields:
                  - name: span
                    label: Columnas
                    widget: select
                    options: [4, 8]
                  - name: stack
                    label: Logos
                    widget: list
                    max: 3
                    fields:
                      - { name: src,   label: Logo,   widget: image }
                      - { name: alt,   label: Nombre, widget: string }
                      - name: size
                        label: Tamaño
                        widget: select
                        options: [tile, tile-xl]
                      - { name: multi, label: Logo secundario (opcional), widget: image, required: false }
