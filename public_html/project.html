  <script>
    function fadeNavigate(url) {
      document.querySelector('.content-area').classList.add('fading');
      setTimeout(() => { window.location.href = url; }, 500);
    }

    const params = new URLSearchParams(window.location.search);
    const projectId = params.get("p");

    const _footerCategories = ['brand-creation', 'brand-development', 'product-design'];
    const _footerCategory = _footerCategories[Math.floor(Math.random() * _footerCategories.length)];

    window._onSwitchLanguage = function (lang) {
      loadProject();
      updateFooter(_footerCategory, true);
    };

    document.addEventListener("DOMContentLoaded", () => {
      switchTheme(localStorage.getItem('theme') || 'light');
      switchLanguage(currentLang);
      loadProject();
      updateFooter(_footerCategory);
    });

    const colSpanMap = { 1: 3, 2: 6, 3: 4, 4: 12 };
    let _projectData = null;

    function loadProject() {
      if (!projectId) { window.location.href = "index.html?tab=brand-development"; return; }

      // Fetch both brand-development and product-design JSON with no-cache
      const fetchOpts = { cache: 'no-cache' };
      Promise.all([
        fetch("brand-development.json", fetchOpts).then(r => r.json()),
        fetch("product-design.json", fetchOpts).then(r => r.json())
      ]).then(([bdData, pdData]) => {
        // Search in brandDevelopment first
        let project = (bdData.brandDevelopment || []).find(p => p.project === projectId);
        let section = 'brandDevelopment';

        // If not found, search in productDesign
        if (!project) {
          project = (pdData.productDesign || []).find(p => p.project === projectId);
          section = 'productDesign';
        }

        if (!project) { window.location.href = "index.html?tab=brand-development"; return; }

        // Render the FormStream case study once project data is available
        if (projectId === "formstream" && typeof window.renderFormStreamCaseStudy === "function") {
          window.renderFormStreamCaseStudy(project);
        }

        // Update sidebar active tab based on project section
        const sidebarTabMap = { brandDevelopment: 'brand-development', productDesign: 'product-design' };
        const activeTab = sidebarTabMap[section] || 'brand-development';
        document.querySelectorAll('#sidebar .sidebar-nav-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === activeTab);
          btn.setAttribute('aria-selected', btn.dataset.tab === activeTab ? 'true' : 'false');
        });

        // Set back link based on section
        const backLinkMap = { brandDevelopment: 'brand-development', productDesign: 'product-design' };
        const backTab = backLinkMap[section] || 'brand-development';
        document.getElementById('project-back-link').onclick = () => {
          event.preventDefault();
          fadeNavigate(`index.html?tab=${backTab}`);
        };

        _projectData = { brandDevelopment: bdData.brandDevelopment, productDesign: pdData.productDesign };
        const label = project.label?.[currentLang] || project.label?.es;
        const projectName = project.projectName || label.name;
        document.title = `${projectName} — estudio.d`;
        document.getElementById("project-name").textContent = projectName;

        const pageUrl = `https://estudiod.site/project.html?p=${projectId}`;
        const ogImage = project.bgImage ? `https://estudiod.site/${project.bgImage}` : `https://estudiod.site/img/square.webp`;
        document.getElementById("canonical").href = pageUrl;
        document.getElementById("og-url").content = pageUrl;
        document.getElementById("og-title").content = `${projectName} — estudio.d`;
        document.getElementById("og-image").content = ogImage;
        document.getElementById("twitter-url").content = pageUrl;
        document.getElementById("twitter-title").content = `${projectName} — estudio.d`;
        document.getElementById("twitter-image").content = ogImage;
        document.documentElement.lang = currentLang;

        const title = project.title?.[currentLang] || project.title?.es || "";
        const industry = label?.industry || "";
        const titleCap = title ? title.charAt(0).toUpperCase() + title.slice(1) : "";
        const industryLow = industry ? industry.charAt(0).toLowerCase() + industry.slice(1) : "";
        const metaText = project.hideProjectMeta ? "" : (titleCap && industryLow ? `${titleCap} ${industryLow}` : titleCap || industry);

        const description = project.description?.[currentLang] || project.description?.es || "";
        const descEl = document.getElementById("project-description");
        descEl.innerHTML = sanitizeHTML(description);
        descEl.classList.toggle("d-none", !description);

        const metaEl = document.getElementById("project-meta");
        metaEl.textContent = metaText;
        metaEl.classList.toggle("d-none", !metaText);

        const gallery = document.getElementById("project-gallery");
        if (gallery) gallery.innerHTML = "";
        document.getElementById("meta-description").content = description;
        document.getElementById("og-description").content = description;
        document.getElementById("twitter-description").content = description;

        // JSON-LD dinámico por proyecto
        const existingLd = document.getElementById("project-ld");
        if (existingLd) existingLd.remove();
        const ld = document.createElement("script");
        ld.type = "application/ld+json";
        ld.id = "project-ld";
        ld.textContent = JSON.stringify({
          "@context": "https://schema.org",
          "@type": "CreativeWork",
          "name": projectName,
          "description": description || label?.industry || "",
          "url": `https://estudiod.site/project.html?p=${projectId}`,
          "image": project.bgImage ? `https://estudiod.site/${project.bgImage}` : undefined,
          "creator": { "@type": "Person", "name": "Diego Fabbri Arpon", "url": "https://estudiod.site" }
        });
        document.head.appendChild(ld);

        if (projectId === "virtualmind") {
          gallery.classList.remove("project-gallery");
          gallery.classList.add("project-gallery-embed");
          const hGuide = document.createElement("div");
          hGuide.className = "guide-h-double-100";
          hGuide.setAttribute("aria-hidden", "true");
          const vGuide = document.createElement("div");
          vGuide.className = "guide-v-double-100";
          vGuide.setAttribute("aria-hidden", "true");
          gallery.appendChild(hGuide);
          gallery.appendChild(vGuide);
          const iframe = document.createElement("iframe");
          iframe.src = "design-kit/index.html";
          iframe.style.cssText = "width:100%;border:none;display:block;min-height:100vh;overflow:hidden;";
          iframe.onload = () => {
            try {
              iframe.style.height = iframe.contentDocument.body.scrollHeight + "px";
            } catch (e) {
              iframe.style.height = "100vh";
            }
            const loader = document.getElementById("project-loader");
            if (loader) {
              loader.classList.add("dismiss");
              loader.addEventListener("transitionend", () => loader.remove(), { once: true });
            }
            document.querySelector(".content-area").classList.remove("fading");
          };
          gallery.appendChild(iframe);
          return;
        }

        let col3Count = 0;

        (project.gallery || []).forEach((item, idx, arr) => {
          const figure = document.createElement("figure");
          const span = colSpanMap[item.cols] || 3;
          figure.className = `project-gallery-item gallery-span-${span}`;

          const hGuide = document.createElement("div");
          hGuide.className = "guide-h-double-100";
          hGuide.setAttribute("aria-hidden", "true");
          const vGuide = document.createElement("div");
          vGuide.className = "guide-v-double-100";
          vGuide.setAttribute("aria-hidden", "true");
          figure.appendChild(hGuide);
          figure.appendChild(vGuide);

          if (item.type === "text") {
            figure.classList.add("gallery-item-text");
            figure.style.background = item.bg || "var(--bg)";
            figure.style.zIndex = 11;
            if (item.logo) {
              const logo = document.createElement("img");
              logo.src = item.logo;
              logo.className = "project-masonry-text-logo";
              logo.alt = "";
              logo.loading = "lazy";
              if (item.logoSize) logo.style.maxHeight = `${item.logoSize}px`;
              figure.appendChild(logo);
            }
            if (item.text) {
              const textEl = document.createElement("div");
              textEl.className = "project-masonry-color-text";
              if (item.textSize) textEl.style.fontSize = item.textSize;
              textEl.innerHTML = sanitizeHTML(item.text[currentLang] || item.text.es || "");
              figure.appendChild(textEl);
            }
          } else {
            const caption = item.caption?.[currentLang] || item.caption?.es || "";
            const isVideo = /\.(mp4|webm|ogg|mov)$/i.test(item.src);
            let media;
            if (isVideo) {
              media = document.createElement("video");
              media.src = item.src;
              media.autoplay = true;
              media.muted = true;
              media.playsInline = true;
              media.loop = item.loop ?? true;
              media.className = "gallery-video";
            } else {
              media = document.createElement("img");
              media.src = item.src;
              if (item.darkSrc) {
                media.dataset.lightSrc = item.src;
                media.dataset.darkSrc = item.darkSrc;
                if ((localStorage.getItem('theme') || 'light') === 'dark') media.src = item.darkSrc;
              }
              if (item.darkBg) {
                figure.dataset.darkBg = '1';
                if ((localStorage.getItem('theme') || 'light') === 'dark') figure.style.backgroundColor = 'var(--manteca)';
              }
              if (item.accentBg) {
                figure.dataset.updateBg = '1';
                const theme = localStorage.getItem('theme') || 'light';
                figure.style.backgroundColor = theme === 'dark' ? 'var(--manteca)' : 'var(--manteca-dark)';
              }
              const autoAlt = item.src.split('/').pop().replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
              media.alt = item.alt || caption || autoAlt;
              media.loading = idx < 2 ? "eager" : "lazy";
            }
            const figcaption = document.createElement("figcaption");
            figcaption.textContent = caption;
            figure.appendChild(media);
            if (caption) figure.appendChild(figcaption);
          }

          gallery.appendChild(figure);

          if (span === 4) {
            col3Count++;
          } else {
            col3Count = 0;
          }
          const nextItem = arr[idx + 1];
          const nextSpan = nextItem ? (colSpanMap[nextItem.cols] || 3) : null;
          if (col3Count % 2 !== 0 && nextSpan !== 4) {
            const spacer = document.createElement("div");
            spacer.className = "gallery-tablet-spacer";
            gallery.appendChild(spacer);
            col3Count = 0;
          }
        });

        // Case study block for FormStream
        // Rendered once project data is available (project is only in scope inside loadProject).
        if (projectId === "formstream") {
          window.renderFormStreamCaseStudy = function (p) {
            document.querySelectorAll('.case-study').forEach(cs => cs.remove());
            const get = (key, fallback) => {
              const v = p[key];
              if (v && typeof v === "object" && !Array.isArray(v)) {
                return v[currentLang] || v.es || fallback;
              }
              return v !== undefined && v !== null ? v : fallback;
            };
            const decisionsHtml = (p.decisions || []).map((d) => `
      <div class="cs-decision-item">
        <div class="cs-section-marker cs-marker--outlined"></div>
        <div class="cs-decision-row">
          <div class="cs-decision-text">
            <h3 class="cs-decision-title">${d.title}</h3>
            <p class="cs-decision-desc">${d.description}</p>
          </div>
          <div class="cs-decision-screen">
            <div class="cs-screen-panel cs-screen-panel--decision">
              <div class="cs-screen-caption-row">
                <span class="cs-screen-num">SCREEN ${d.screenNum}</span>
                <span class="cs-screen-place">PLACEHOLDER</span>
              </div>
              <div class="cs-screen-body">
                <p class="cs-screen-title">${d.caption}</p>
                <p class="cs-screen-sub">Screen placeholder</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    `).join('');
            const cs = document.createElement("section");
            cs.className = "case-study cs-case-study";
            cs.innerHTML = `
      <!-- Hero / Screen 01: narrow reading column, shared left edge, no rail -->
      <div class="cs-section cs-hero-section">
        <h1 class="cs-hero-title">${get("projectName", "FormStream")}</h1>
        <p class="cs-hero-subtitle">${get("subtitle", "Enterprise Form Experience Platform")}</p>
        <p class="cs-hero-desc">${get("introduction", "")}</p>
        <div class="cs-screen-panel cs-screen-panel--hero">
          <div class="cs-screen-caption-row">
            <span class="cs-screen-num">SCREEN 01</span>
            <span class="cs-screen-place">PLACEHOLDER</span>
          </div>
          <div class="cs-screen-body">
            <p class="cs-screen-title">${get("projectName", "FormStream")} · Enterprise form experience</p>
            <p class="cs-screen-sub">Screen placeholder</p>
          </div>
        </div>
      </div>

      <!-- Vertical rail: Project Snapshot marker center → Outcome marker center -->
      <div class="cs-rail-area">
        <div class="cs-rail-line"></div>

        <!-- Project Snapshot: no line, no circle -->

        <div class="cs-section ps-0">
          <h2 class="cs-heading--section">Project Snapshot</h2>
          <div class="cs-snapshot-grid">
            <div class="cs-snapshot-col">
              <div class="cs-snapshot-item">
                <span class="cs-snapshot-label">Client</span>
                <div class="cs-snapshot-company">
                  <img src="${get("src", "")}" alt="${get("client", "Quik!")} logo" width="120" height="45" loading="lazy">
                </div>
              </div>
              <div class="cs-snapshot-item">
                <span class="cs-snapshot-label">Role</span>
                <span class="cs-snapshot-value">${get("team", "Product Designer / UX-UI Designer")}</span>
              </div>
              <div class="cs-snapshot-item">
                <span class="cs-snapshot-label">Team</span>
                <span class="cs-snapshot-value">${get("teamMembers", "QA + DEV Team")}</span>
              </div>
            </div>
            <div class="cs-snapshot-col">
              <div class="cs-snapshot-item">
                <span class="cs-snapshot-label">Work</span>
                <span class="cs-snapshot-value">${get("scope", "")}</span>
              </div>
              <div class="cs-snapshot-item">
                <span class="cs-snapshot-label">Timeline</span>
                <span class="cs-snapshot-value">${get("timeline", "3 months")}</span>
              </div>
              <div class="cs-snapshot-item">
                <span class="cs-snapshot-label">Link</span>
                <a href="${get("URLFigma", "")}" class="cs-snapshot-link" target="_blank" rel="noopener">↗ Figma</a>
              </div>
            </div>
          </div>
        </div>

        <!-- Challenge -->

        <div class="cs-section ps-2">
          <div class="cs-section-marker cs-marker--filled"></div>
          <h2 class="cs-heading--section">${get("challengeTitle", "Challenge")}</h2>
          <p class="cs-body--lead">${get("challenge", "")}</p>
        </div>

        <!-- Design Question -->

        <div class="cs-section ps-2">
          <div class="cs-section-marker cs-marker--outlined"></div>
          <div class="cs-dq">
            <p class="cs-dq-label">Design Question</p>
            <p class="cs-dq-text">${get("designQuestion", "")}</p>
          </div>
        </div>

        <!-- Product Direction -->
        
        <div class="cs-section ps-2">
          <div class="cs-section-marker cs-marker--filled"></div>
          <h2 class="cs-heading--section">${get("productDirectionTitle", "Product Direction")}</h2>
          <p class="cs-body--lead">${get("productDirection", "")}</p>
        </div>

        <!-- Design Decisions: one section marker, shared grid (text left | screens 02-04 right) -->
        
        <div class="cs-section cs-decision-section ps-3">
          <div class="cs-section-marker cs-marker--filled"></div>
          <h2 class="cs-heading--section">${get("decisionsTitle", "Design Decisions")}</h2>
          <div class="cs-decision-grid">
            ${decisionsHtml}
          </div>
        </div>

        <!-- Delivery -->
        
        <div class="cs-section ps-2">
          <div class="cs-section-marker cs-marker--filled"></div>
          <h2 class="cs-heading--section">${get("deliveryTitle", "Delivery")}</h2>
          <p class="cs-body--lead">${get("delivery", "")}</p>
        </div>

        <!-- Outcome -->
        
        <div class="cs-section ps-2">
          <div class="cs-section-marker cs-marker--filled"></div>
          <h2 class="cs-heading--section">${get("outcomeTitle", "Outcome")}</h2>
          <p class="cs-body--lead">${get("outcome", "")}</p>
        </div>
      </div>
    `;
            const gallery = document.getElementById("project-gallery");
            gallery.parentNode.insertBefore(cs, gallery.nextSibling);

            // Rail line: center of first marker (Project Snapshot) → center of last marker (Outcome).
            // No protrusion at either end; line sits behind markers (filled cover it, hollow show page bg inside).
            (function positionRailLine() {
              const railArea = cs.querySelector('.cs-rail-area');
              const railLine = cs.querySelector('.cs-rail-line');
              const markers = cs.querySelectorAll('.cs-section-marker');
              if (!railArea || !railLine || markers.length < 2) return;
              const first = markers[0];
              const last = markers[markers.length - 1];
              const update = () => {
                const r = railArea.getBoundingClientRect();
                const f = first.getBoundingClientRect();
                const l = last.getBoundingClientRect();
                const start = f.top + f.height / 2 - r.top;
                const end = l.top + l.height / 2 - r.top;
                railLine.style.top = start + 'px';
                railLine.style.bottom = (r.height - end) + 'px';
              };
              update();
              window.addEventListener('resize', update);
            })();
          };
        }



        const loader = document.getElementById("project-loader");
        if (loader) {
          loader.classList.add("dismiss");
          loader.addEventListener("transitionend", () => loader.remove(), { once: true });
        }
        document.querySelector(".content-area").classList.remove("fading");
      });
    }
  </script>
