  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"

  <script>
    const params = new URLSearchParams(window.location.search);
    const projectId = params.get("p");

    document.addEventListener("DOMContentLoaded", () => {

      document.querySelectorAll("a[href]").forEach(a => {
        const href = a.getAttribute("href");
        if (!href || href.startsWith("http") || href.startsWith("#")) return;
        a.addEventListener("click", e => {
          e.preventDefault();
          document.body.classList.add("fade-out");
          setTimeout(() => window.location.href = href, 300);
        });
      });

      switchLanguage(currentLang);
      window.addEventListener("resize", layoutMasonry);
    });

    window.switchLanguage = function (lang) {
      currentLang = lang;
      localStorage.setItem("language", lang);
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const text = t(el.getAttribute("data-i18n"));
        if (text) el.innerHTML = text;
      });
      document.querySelectorAll("#lang-en, #lang-es").forEach(b => b.classList.remove("active"));
      const btn = document.getElementById("lang-" + lang);
      if (btn) btn.classList.add("active");
      document.documentElement.lang = lang;
      loadProject();
    };

    function layoutMasonry() {
      const gallery = document.getElementById("project-gallery");
      const items = Array.from(gallery.querySelectorAll(".project-masonry-item"));
      if (!items.length) return;
      const numCols = window.innerWidth <= 767 ? 1 : window.innerWidth <= 1024 ? 2 : 4;
      const gap = 24;
      const totalWidth = gallery.offsetWidth;
      const colWidth = (totalWidth - gap * (numCols - 1)) / numCols;
      const colTops = new Array(numCols).fill(0);

      items.forEach(item => {
        const span = Math.min(item.dataset.cols || 1, numCols);
        // encontrar la posición left óptima para span columnas consecutivas
        let bestCol = 0, bestTop = Infinity;
        for (let c = 0; c <= numCols - span; c++) {
          const top = Math.max(...colTops.slice(c, c + span));
          if (top < bestTop) { bestTop = top; bestCol = c; }
        }
        const left = bestCol * (colWidth + gap);
        const width = span * colWidth + (span - 1) * gap;
        item.style.width = width + "px";
        item.style.left = left + "px";
        item.style.top = bestTop + "px";
        const height = item.offsetHeight;
        for (let c = bestCol; c < bestCol + span; c++) {
          colTops[c] = bestTop + height + gap;
        }
      });

      gallery.style.height = Math.max(...colTops) - gap + "px";
    }

    function loadProject() {
      if (!projectId) { window.location.href = "index.html?tab=brand-development"; return; }

      fetch("brand-development.json")
        .then(r => r.json())
        .then(data => {
          const project = data.brandDevelopment.find(p => p.project === projectId);
          if (!project) { window.location.href = "index.html?tab=brand-development"; return; }

          const label = project.label?.[currentLang] || project.label?.es;
          const projectName = project.projectName || label.name;
          document.title = `${projectName} — diseño d.`;
          document.getElementById("project-name").textContent = projectName;

          const gallery = document.getElementById("project-gallery");
          gallery.classList.remove("fade-in");
          void gallery.offsetWidth;
          gallery.classList.add("fade-in");
          document.querySelector(".project-header").classList.remove("fade-in");
          void document.querySelector(".project-header").offsetWidth;
          document.querySelector(".project-header").classList.add("fade-in");
          gallery.innerHTML = "";

          const description = project.description?.[currentLang] || project.description?.es || "";
          const descEl = document.getElementById("project-description");
          descEl.textContent = description;
          descEl.classList.toggle("hidden", !description);

          (project.gallery || []).forEach(item => {
            const figure = document.createElement("figure");
            figure.className = "project-masonry-item";
            figure.dataset.cols = item.cols || 1;

            const hGuide = document.createElement("div");
            hGuide.className = "guide-h-double-100";
            hGuide.setAttribute("aria-hidden", "true");
            const vGuide = document.createElement("div");
            vGuide.className = "guide-v-double-100";
            vGuide.setAttribute("aria-hidden", "true");
            figure.appendChild(hGuide);
            figure.appendChild(vGuide);

            if (item.type === "carousel") {
              const slides = item.slides || [];
              let current = 0;
              const imgEl = document.createElement("img");
              imgEl.src = slides[0]?.src || "";
              imgEl.alt = slides[0]?.caption?.[currentLang] || slides[0]?.caption?.es || "";
              imgEl.loading = "eager";
              imgEl.className = "carousel-slide";
              const figcaption = document.createElement("figcaption");
              figcaption.textContent = imgEl.alt;
              const prev = document.createElement("button");
              prev.className = "carousel-btn carousel-prev";
              prev.innerHTML = "←";
              const next = document.createElement("button");
              next.className = "carousel-btn carousel-next";
              next.innerHTML = "→";
              const counter = document.createElement("span");
              counter.className = "carousel-counter";
              counter.textContent = `1 / ${slides.length}`;
              const go = (dir) => {
                current = (current + dir + slides.length) % slides.length;
                const s = slides[current];
                imgEl.src = s.src;
                imgEl.alt = s.caption?.[currentLang] || s.caption?.es || "";
                figcaption.textContent = imgEl.alt;
                counter.textContent = `${current + 1} / ${slides.length}`;
                layoutMasonry();
              };
              prev.addEventListener("click", () => go(-1));
              next.addEventListener("click", () => go(1));
              figure.appendChild(imgEl);
              figure.appendChild(prev);
              figure.appendChild(next);
              figure.appendChild(counter);
              figure.appendChild(figcaption);
            } else if (item.type === "color") {
              figure.style.background = item.bg || "var(--manteca)";
              figure.style.zIndex = 11;
              if (item.text) {
                const p = document.createElement("p");
                p.className = "project-masonry-color-text";
                p.textContent = item.text[currentLang] || item.text.es || "";
                figure.appendChild(p);
              }
            } else {
              const caption = item.caption?.[currentLang] || item.caption?.es || "";
              const isVideo = /\.(mp4|webm|ogg)$/i.test(item.src);
              let media;
              if (isVideo) {
                media = document.createElement("video");
                media.src = item.src;
                media.autoplay = true;
                media.muted = true;
                media.playsInline = true;
              } else {
                media = document.createElement("img");
                media.src = item.src;
                media.alt = caption;
                media.loading = "eager";
              }
              const figcaption = document.createElement("figcaption");
              figcaption.textContent = caption;
              figure.appendChild(media);
              figure.appendChild(figcaption);
            }

            gallery.appendChild(figure);
          });

          // esperar que las imágenes y videos carguen para calcular alturas correctas
          const images = gallery.querySelectorAll("img");
          const videos = gallery.querySelectorAll("video");
          let pending = images.length + videos.length;
          const onLoad = () => { if (--pending <= 0) layoutMasonry(); };
          if (!pending) { layoutMasonry(); }
          else {
            images.forEach(img => { if (img.complete) onLoad(); else { img.onload = onLoad; img.onerror = onLoad; } });
            videos.forEach(v => { if (v.readyState >= 1) onLoad(); else { v.onloadedmetadata = onLoad; v.onerror = onLoad; } });
          }

        });
    }
  </script>
