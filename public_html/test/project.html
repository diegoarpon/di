  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <script>
    function fadeNavigate(url) {
      document.querySelector('.content-area').classList.add('fading');
      setTimeout(() => { window.location.href = url; }, 500);
    }

    const params = new URLSearchParams(window.location.search);
    const projectId = params.get("p");

    document.addEventListener("DOMContentLoaded", () => {
      switchLanguage(currentLang);
      loadProject();
    });

    window.switchLanguage = function (lang) {
      currentLang = lang;
      localStorage.setItem("language", lang);
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const text = t(el.getAttribute("data-i18n"));
        if (text) el.innerHTML = text;
      });
      document.querySelectorAll("#lang-en, #lang-es").forEach(b => b.classList.remove("active"));
      const btn = document.getElementById("lang-" + lang);
      if (btn) btn.classList.add("active");
      document.documentElement.lang = lang;
    };

    const colSpanMap = { 1: 3, 2: 6, 3: 4, 4: 12 };

    function loadProject() {
      if (!projectId) { window.location.href = "index.html?tab=brand-development"; return; }

      fetch("brand-development.json")
        .then(r => r.json())
        .then(data => {
          const project = data.brandDevelopment.find(p => p.project === projectId);
          if (!project) { window.location.href = "index.html?tab=brand-development"; return; }

          const label = project.label?.[currentLang] || project.label?.es;
          const projectName = project.projectName || label.name;
          document.title = `${projectName} — diseño d.`;
          document.getElementById("project-name").textContent = projectName;

          const metaEl = document.getElementById("project-meta");
          const title = project.title?.[currentLang] || project.title?.es || "";
          const industry = label?.industry || "";
          const titleCap = title ? title.charAt(0).toUpperCase() + title.slice(1) : "";
          const industryLow = industry ? industry.charAt(0).toLowerCase() + industry.slice(1) : "";
          const metaText = titleCap && industryLow ? `${titleCap} ${industryLow}` : titleCap || industry;
          metaEl.textContent = metaText;
          metaEl.classList.toggle("hidden", !metaText);

          const gallery = document.getElementById("project-gallery");
          gallery.innerHTML = "";

          if (projectId === "virtualmind") {
            gallery.classList.remove("project-gallery");
            gallery.classList.add("project-gallery-embed");
            const shadow = gallery.attachShadow({ mode: "open" });
            fetch("design-kit/index.html")
              .then(r => r.text())
              .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");
                doc.querySelectorAll("script").forEach(el => el.remove());
                doc.querySelectorAll("[src]").forEach(el => {
                  const val = el.getAttribute("src");
                  if (val && !val.startsWith("http") && !val.startsWith("design-kit/")) {
                    el.setAttribute("src", "design-kit/" + val);
                  }
                });
                doc.querySelectorAll("[href]").forEach(el => {
                  const val = el.getAttribute("href");
                  if (val && !val.startsWith("http") && !val.startsWith("#") && !val.startsWith("design-kit/")) {
                    el.setAttribute("href", "design-kit/" + val);
                  }
                });
                shadow.innerHTML = `
                  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
                  <link rel="stylesheet" href="design-kit/main.css">
                  <style>:host { display: block; border: 1px solid var(--graphite); }</style>
                  ${doc.body.innerHTML}
                  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"><\/script>
                  <script src="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"><\/script>
                `;
                const loader = document.getElementById("project-loader");
                if (loader) {
                  loader.classList.add("dismiss");
                  loader.addEventListener("transitionend", () => loader.remove(), { once: true });
                }
                document.querySelector(".content-area").classList.remove("fading");
              });
            return;
          }

          const description = project.description?.[currentLang] || project.description?.es || "";
          const descEl = document.getElementById("project-description");
          descEl.innerHTML = description;
          descEl.classList.toggle("hidden", !description);

          (project.gallery || []).forEach(item => {
            const figure = document.createElement("figure");
            const span = colSpanMap[item.cols] || 3;
            figure.className = `project-gallery-item gallery-span-${span}`;

            const hGuide = document.createElement("div");
            hGuide.className = "guide-h-double-100";
            hGuide.setAttribute("aria-hidden", "true");
            const vGuide = document.createElement("div");
            vGuide.className = "guide-v-double-100";
            vGuide.setAttribute("aria-hidden", "true");
            figure.appendChild(hGuide);
            figure.appendChild(vGuide);

            if (item.type === "carousel") {
              const slides = item.slides || [];
              let current = 0;
              const imgEl = document.createElement("img");
              imgEl.src = slides[0]?.src || "";
              imgEl.alt = slides[0]?.caption?.[currentLang] || slides[0]?.caption?.es || "";
              imgEl.loading = "eager";
              imgEl.className = "carousel-slide";
              const figcaption = document.createElement("figcaption");
              figcaption.textContent = imgEl.alt;
              const prev = document.createElement("button");
              prev.className = "carousel-btn carousel-prev";
              prev.innerHTML = "←";
              const next = document.createElement("button");
              next.className = "carousel-btn carousel-next";
              next.innerHTML = "→";
              const counter = document.createElement("span");
              counter.className = "carousel-counter";
              counter.textContent = `1 / ${slides.length}`;
              const go = (dir) => {
                current = (current + dir + slides.length) % slides.length;
                const s = slides[current];
                imgEl.src = s.src;
                imgEl.alt = s.caption?.[currentLang] || s.caption?.es || "";
                figcaption.textContent = imgEl.alt;
                counter.textContent = `${current + 1} / ${slides.length}`;
              };
              prev.addEventListener("click", () => go(-1));
              next.addEventListener("click", () => go(1));
              figure.appendChild(imgEl);
              figure.appendChild(prev);
              figure.appendChild(next);
              figure.appendChild(counter);
              if (imgEl.alt) figure.appendChild(figcaption);
            } else if (item.type === "text") {
              figure.style.background = item.bg || "var(--manteca)";
              figure.style.zIndex = 11;
              if (item.logo) {
                const logo = document.createElement("img");
                logo.src = item.logo;
                logo.className = "project-masonry-text-logo";
                logo.alt = "";
                logo.loading = "lazy";
                if (item.logoSize) logo.style.maxHeight = `${item.logoSize}px`;
                figure.appendChild(logo);
              }
              if (item.text) {
                const textEl = document.createElement("div");
                textEl.className = "project-masonry-color-text";
                textEl.textContent = item.text[currentLang] || item.text.es || "";
                figure.appendChild(textEl);
              }
            } else {
              const caption = item.caption?.[currentLang] || item.caption?.es || "";
              const isVideo = /\.(mp4|webm|ogg)$/i.test(item.src);
              let media;
              if (isVideo) {
                media = document.createElement("video");
                media.src = item.src;
                media.autoplay = true;
                media.muted = true;
                media.playsInline = true;
              } else {
                media = document.createElement("img");
                media.src = item.src;
                media.alt = caption;
                media.loading = "eager";
              }
              const figcaption = document.createElement("figcaption");
              figcaption.textContent = caption;
              figure.appendChild(media);
              if (caption) figure.appendChild(figcaption);
            }

            gallery.appendChild(figure);
          });

          const loader = document.getElementById("project-loader");
          if (loader) {
            loader.classList.add("dismiss");
            loader.addEventListener("transitionend", () => loader.remove(), { once: true });
          }
          document.querySelector(".content-area").classList.remove("fading");

        });
    }
  </script>
