    const caseStudyContent = {
      en: {
        presentation: {
          title: "FormStream",
          lead: "A desktop application that transforms how teams complete and manage digital forms. By combining intelligent field detection, real-time validation, and a guidance mode that walks users through complex forms step by step, FormStream reduces completion time by 60% and eliminates submission errors.",
          meta: [
            { label: "Role", value: "Product Design Lead" },
            { label: "Platform", value: "macOS / Windows (Electron)" },
            { label: "Year", value: "2025" },
            { label: "Tools", value: "Figma, FigJam, Principle, VS Code" }
          ],
          heroImage: "img/projects/formstream/01-dashboard.webp",
          heroCaption: "Main dashboard — form list with status indicators and quick actions"
        },
        challenge: {
          title: "The Challenge",
          description: "Enterprise teams deal with hundreds of form types — onboarding, compliance, procurement, IT requests — each with unique validation rules, conditional logic, and approval chains. Existing tools either oversimplify (missing critical logic) or overwhelm (exposing every field at once). Users abandon forms mid-way, submit incomplete data, or route to wrong approvers.",
          concepts: [
            {
              title: "Cognitive Load",
              description: "Long forms with 50+ fields create decision paralysis. Users don't know which fields are required, optional, or conditional until they reach them."
            },
            {
              title: "Validation Latency",
              description: "Server-side validation returns errors only after submission. Users lose context, scroll back, fix, re-submit — a cycle that breaks flow and trust."
            },
            {
              title: "Routing Ambiguity",
              description: "Complex approval chains mean users guess the next approver. Wrong routing adds days of delay and creates compliance risk."
            }
          ]
        },
        navigation: {
          title: "Navigation & Information Architecture",
          description: "We reorganized the IA around three pillars: Forms (browse, search, filter), In Progress (drafts, assigned, review), and History (submitted, approved, rejected). A persistent left rail provides primary navigation; a contextual right panel surfaces form-specific actions — duplicate, template, export — without cluttering the main view.",
          image: "img/projects/formstream/02-form-builder.webp",
          caption: "Navigation structure — left rail, form list, and contextual action panel"
        },
        guidance: {
          title: "Guidance Mode",
          description: "Guidance Mode is the core differentiator. It transforms any form into a step-by-step conversation, showing one logical section at a time, explaining why each field matters, and validating inline. Users can exit guidance anytime to see the full form — flexibility for power users, hand-holding for everyone else.",
          comparison: [
            {
              label: "Empty State",
              caption: "Clean entry point — only the first required section visible. Progressive disclosure prevents overwhelm.",
              image: "img/projects/formstream/guidance-empty.webp"
            },
            {
              label: "Active Guidance",
              caption: "Inline help text, real-time validation, and a persistent progress indicator. Users always know where they are.",
              image: "img/projects/formstream/guidance-active.webp"
            }
          ]
        },
        autocomplete: {
          title: "Smart Autocomplete",
          description: "Field-level autocomplete learns from org-wide submissions. When a user starts typing a vendor name, cost center, or employee ID, suggestions appear ranked by frequency and recency. Admins can seed suggestions from ERP/HRIS imports. Reduces keystrokes by ~40% on repetitive fields.",
          image: "img/projects/formstream/03-preview.webp",
          caption: "Autocomplete dropdown — ranked suggestions with recent-used indicators"
        },
        fullExperience: {
          title: "End-to-End Experience",
          description: "Three screens capture the complete journey: discover a form, complete it with guidance, confirm and track.",

              number: "01",

              image: "img/projects/formstream/01-dashboard.webp"

              number: "02",
              label: "Complete",
              caption: "Guidance Mode walks through sections. Inline validation catches errors before submission. Progress bar shows completion.",

              number: "03",
              label: "Confirm",

              image: "img/projects/formstream/03-preview.webp"

        closure: {
          title: "Outcome",
          synthesis: "FormStream launched to 2,400 users across 4 departments. Form completion time dropped from 12 min to 4.8 min average. Submission error rate fell from 23% to 2%. The guidance pattern is now being adapted for the mobile companion app and the admin template builder.",

            title: "QuikForms Manager →",
            url: "project.html?p=quikforms-manager"
          }
        }
      },

          lead: "Una aplicación de escritorio que transforma la forma en que los equipos completan y gestionan formularios digitales. Al combinar detección inteligente de campos, validación en tiempo real y un modo guiado que acompaña al usuario paso a paso en formularios complejos, FormStream reduce el tiempo de completado en un 60% y elimina los errores de envío.",

            { label: "Plataforma", value: "macOS / Windows (Electron)" },
            { label: "Año", value: "2025" },
            { label: "Herramientas", value: "Figma, FigJam, Principle, VS Code" }

          heroImage: "img/projects/formstream/01-dashboard.webp",
          heroCaption: "Dashboard principal — lista de formularios con indicadores de estado y acciones rápidas"

          description: "Los equipos empresariales manejan cientos de tipos de formularios — onboarding, cumplimiento, compras, solicitudes TI — cada uno con reglas de validación únicas, lógica condicional y cadenas de aprobación. Las herramientas existentes o simplifican demasiado (perdiendo lógica crítica) o abruman (exponiendo todos los campos a la vez). Los usuarios abandonan formularios a medio camino, envían datos incompletos o derivan al aprobador incorrecto.",

              title: "Carga Cognitiva",

    // Render case study content
    function renderCaseStudy() {
      const content = caseStudyContent[currentLang] || caseStudyContent.en;

      // Helper to set text content
      function setText(selector, text) {
        const el = document.querySelector(selector);
        if (el) el.textContent = text;
      }

      // Helper to set HTML content
      function setHTML(selector, html) {
        const el = document.querySelector(selector);
        if (el) el.innerHTML = html;
      }

      // Helper to set attribute
      function setAttr(selector, attr, value) {
        const el = document.querySelector(selector);
        if (el) el.setAttribute(attr, value);
      }

      // 1. PRESENTACIÓN
      setText('#cs-presentation-title', content.presentation.title);
      setText('.cs-presentation .cs-body--lead', content.presentation.lead);

      // Meta list
      const metaContainer = document.querySelector('.cs-presentation .cs-meta');
      if (metaContainer) {
        metaContainer.innerHTML = content.presentation.meta.map(m =>
          `<dt>${m.label}</dt><dd>${m.value}</dd>`
        ).join('');
      }

      // Hero image
      const heroFigure = document.querySelector('.cs-presentation .cs-figure--full');
      if (heroFigure) {
        heroFigure.innerHTML = `
          <img src="${content.presentation.heroImage}" alt="${content.presentation.heroCaption}" loading="eager" />
          <figcaption class="cs-caption">${content.presentation.heroCaption}</figcaption>
        `;
      }

      // 2. DESAFÍO
      setText('#cs-challenge-title', content.challenge.title);
      setText('.cs-challenge .cs-body', content.challenge.description);

      const conceptsContainer = document.querySelector('.cs-concepts');
      if (conceptsContainer) {
        conceptsContainer.innerHTML = content.challenge.concepts.map(c => `
          <article class="cs-col cs-col-4 cs-col-md-12 cs-concept">
            <h3 class="cs-heading cs-heading--concept">${c.title}</h3>
            <p class="cs-body cs-body--small">${c.description}</p>
          </article>
        `).join('');
      }

      // 3. NAVEGACIÓN
      setText('#cs-navigation-title', content.navigation.title);
      setText('.cs-navigation .cs-body', content.navigation.description);

      const navFigure = document.querySelector('.cs-navigation .cs-figure');
      if (navFigure) {
        navFigure.innerHTML = `
          <img src="${content.navigation.image}" alt="${content.navigation.caption}" loading="lazy" />
          <figcaption class="cs-caption">${content.navigation.caption}</figcaption>
        `;
      }

      // 4. GUIDANCE MODE
      setText('#cs-guidance-title', content.guidance.title);
      setText('.cs-guidance .cs-body--lead', content.guidance.description);

      const comparisonContainer = document.querySelector('.cs-comparison');
      if (comparisonContainer) {
        comparisonContainer.innerHTML = content.guidance.comparison.map(c => `
          <figure class="cs-col cs-col-6 cs-col-md-12 cs-figure">
            <img src="${c.image}" alt="${c.caption}" loading="lazy" />
            <figcaption class="cs-caption">
              <span class="cs-caption-label">${c.label}</span>
              ${c.caption}
            </figcaption>
          </figure>
        `).join('');
      }

      // 5. AUTOCOMPLETADO
      setText('#cs-autocomplete-title', content.autocomplete.title);
      setText('.cs-autocomplete .cs-body', content.autocomplete.description);

      const acFigure = document.querySelector('.cs-autocomplete .cs-figure');
      if (acFigure) {
        acFigure.innerHTML = `
          <img src="${content.autocomplete.image}" alt="${content.autocomplete.caption}" loading="lazy" />
          <figcaption class="cs-caption">${content.autocomplete.caption}</figcaption>
        `;
      }

      // 6. EXPERIENCIA COMPLETA
      setText('#cs-full-experience-title', content.fullExperience.title);
      setText('.cs-full-experience .cs-body--lead', content.fullExperience.description);

      const screensContainer = document.querySelector('.cs-screens');
      if (screensContainer) {
        screensContainer.innerHTML = content.fullExperience.screens.map(s => `
          <figure class="cs-col cs-col-4 cs-col-md-12 cs-figure cs-screen">
            <div class="cs-screen-number" aria-hidden="true">${s.number}</div>
            <img src="${s.image}" alt="${s.caption}" loading="lazy" />
            <figcaption class="cs-caption">
              <span class="cs-caption-label">${s.label}</span>
              ${s.caption}
            </figcaption>
          </figure>
        `).join('');
      }

      // 7. CIERRE
      setText('#cs-closure-title', content.closure.title);
      setText('.cs-closure .cs-body--lead', content.closure.synthesis);

      const nextLink = document.querySelector('.cs-next-project');
      if (nextLink) {
        nextLink.href = content.closure.nextProject.url;
        nextLink.innerHTML = `
          <span class="cs-next-label" data-i18n="nextProject">Next project</span>
          <span class="cs-next-title">${content.closure.nextProject.title}</span>
          <span class="cs-next-arrow" aria-hidden="true">→</span>
        `;
      }

      // Update meta tags
      document.title = `${content.presentation.title} — estudio.d`;
      document.getElementById('meta-description').content = content.presentation.lead;
      document.getElementById('og-title').content = `${content.presentation.title} — estudio.d`;
      document.getElementById('og-description').content = content.presentation.lead;
      document.getElementById('og-image').content = `https://estudiod.site/${content.presentation.heroImage}`;
      document.getElementById('twitter-title').content = `${content.presentation.title} — estudio.d`;
      document.getElementById('twitter-description').content = content.presentation.lead;
      document.getElementById('twitter-image').content = `https://estudiod.site/${content.presentation.heroImage}`;
      document.getElementById('canonical').href = `https://estudiod.site/project-formstream.html`;
      document.getElementById('og-url').content = `https://estudiod.site/project-formstream.html`;
      document.getElementById('twitter-url').content = `https://estudiod.site/project-formstream.html`;

      // JSON-LD
      const existingLd = document.getElementById("project-ld");
      if (existingLd) existingLd.remove();
      const ld = document.createElement("script");
      ld.type = "application/ld+json";
      ld.id = "project-ld";
      ld.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "CreativeWork",
        "name": content.presentation.title,
        "description": content.presentation.lead,
        "url": `https://estudiod.site/project-formstream.html`,
        "image": `https://estudiod.site/${content.presentation.heroImage}`,
        "creator": { "@type": "Person", "name": "Diego Fabbri Arpon", "url": "https://estudiod.site" }
      });
      document.head.appendChild(ld);

      // Hide loader
      const loader = document.getElementById("project-loader");
      if (loader) {
        loader.classList.add("dismiss");
        loader.addEventListener("transitionend", () => loader.remove(), { once: true });
      }
      document.querySelector(".content-area").classList.remove("fading");
    }

    // Language switch handler
    window._onSwitchLanguage = function (lang) {
      renderCaseStudy();
      // Update footer
      const _footerCategories = ['brand-creation', 'brand-development', 'product-design'];
      const _footerCategory = _footerCategories[Math.floor(Math.random() * _footerCategories.length)];
      updateFooter(_footerCategory, true);
    };

    // Initialize
    document.addEventListener("DOMContentLoaded", () => {
      switchTheme(currentTheme);
      switchLanguage(currentLang);
      renderCaseStudy();
      const _footerCategories = ['brand-creation', 'brand-development', 'product-design'];
      const _footerCategory = _footerCategories[Math.floor(Math.random() * _footerCategories.length)];
      updateFooter(_footerCategory);
    });

    // Footer functions (from main.js)
    const _footerQuotes = {
      'brand-creation': {
        es: { quote: 'Una marca no es lo que tú dices que es. Es lo que ellos dicen que es.', author: 'Marty Neumeier' },
        en: { quote: 'A brand is not what you say it is. It\'s what they say it is.', author: 'Marty Neumeier' }
      },
      'brand-development': {
        es: { quote: 'El diseño es el embajador silencioso de tu marca.', author: 'Paul Rand' },
        en: { quote: 'Design is the silent ambassador of your brand.', author: 'Paul Rand' }
      },
      'product-design': {
        es: { quote: 'El diseño no es solo cómo se ve o se siente. El diseño es cómo funciona.', author: 'Steve Jobs' },
        en: { quote: 'Design is not just what it looks like and feels like. Design is how it works.', author: 'Steve Jobs' }
      }
    };

    function updateFooter(category, forceLangSwitch = false) {
      const quoteEl = document.getElementById('footer-quote');
      const authorEl = document.getElementById('footer-author');
      if (!quoteEl || !authorEl) return;
      const quotes = _footerQuotes[category] || _footerQuotes['product-design'];
      const q = quotes[currentLang] || quotes.en;
      quoteEl.textContent = q.quote;
      authorEl.textContent = `— ${q.author}`;
    }

    function switchTheme(theme) {
      const html = document.documentElement;
      const isDark = theme === 'dark';
      html.classList.add('theme-transitioning');
      html.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);

      document.querySelectorAll('#theme-light, #theme-dark').forEach(btn => btn.classList.remove('active'));
      document.getElementById('theme-' + theme)?.classList.add('active');

      const lightImg = document.querySelector('#theme-light img');
      const darkImg = document.querySelector('#theme-dark img');
      if (lightImg && darkImg) {
        lightImg.src = isDark ? 'img/circle-solid-full.svg' : 'img/circle-regular-full.svg';
        darkImg.src = isDark ? 'img/circle-regular-full.svg' : 'img/circle-solid-full.svg';
      }

      document.querySelectorAll('img[src*="logo-estudio-d"]').forEach(img => {
        img.src = isDark ? 'img/logo-estudio-d-dark-alt.svg' : 'img/logo-estudio-d-alt.svg';
      });

      setTimeout(() => html.classList.remove('theme-transitioning'), 300);
    }

    // Translations (simplified - using the existing translations.js would be better)
    const translations = {
      en: {
        brandCreation: 'brand creation',
        brandDevelopment: 'brand development',
        productDesign: 'product design',
        back: 'back',
        nextProject: 'Next project'
      },
      es: {
        brandCreation: 'creación de marca',
        brandDevelopment: 'desarrollo de marca',
        productDesign: 'diseño de producto',
        back: 'volver',
        nextProject: 'Siguiente proyecto'
      }
    };

    let currentLang = localStorage.getItem('language') || 'en';

    function switchLanguage(lang) {
      currentLang = lang;
      localStorage.setItem("language", lang);

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        const text = translations[lang]?.[key] || translations.en[key];
        if (text) el.textContent = text;
      });

      const cvLink = document.getElementById("cv-link");
      if (cvLink) cvLink.href = lang === "en" ? "cv_diego_fabbri_arpon_en_2026.pdf" : "cv_diego_fabbri_arpon_es_2026.pdf";

      document.querySelectorAll("#lang-en, #lang-es").forEach((btn) => btn.classList.remove("active"));
      const btn = document.getElementById("lang-" + lang);
      if (btn) btn.classList.add("active");

      document.documentElement.lang = lang;
    }

    // Mobile sidebar toggle
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const toggle = document.querySelector(".mobile-menu-toggle");
      const overlay = document.getElementById("menu-overlay");

      sidebar.classList.toggle("open");
      const isOpen = sidebar.classList.contains("open");
      toggle.classList.toggle("open", isOpen);
      toggle.setAttribute("aria-expanded", isOpen);
      overlay.classList.toggle("active", isOpen);
      document.body.style.overflow = isOpen ? "hidden" : "";
    }
  </script>
